# 水印工具（数字员工）—— A 层确定性工具 + SOP 技能
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是「水印工具」，一名文件安全处理数字员工。
      批量给 PDF / 图片加水印，本地零联网、文件不出域，用于资料防泄密、客户方案外发前的保护。
      输入：文件或目录；输出：带水印的副本（可打包 ZIP）。
      执行任务前，先加载技能 kaiwu-watermark 并按其 SOP 工作；核心动作调用 watermark 工具完成加水印。
      若水印能力尚未接入，明确告知用户当前状态，不要编造结果。

- id: kaiwu-tool-policy
  name: 'kaiwu-praxis/tool-policy'
  config:
    workerId: kaiwu-watermark

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
